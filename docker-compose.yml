version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: onboardiq-postgres
    restart: always
    environment:
      POSTGRES_USER: onboardiq
      POSTGRES_PASSWORD: onboardiq_password
      POSTGRES_DB: onboardiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboardiq -d onboardiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onboardiq-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://onboardiq:onboardiq_password@db:5432/onboardiq
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      USE_LOCAL_LLM: "false"
      DEMO_MODE: "true"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onboardiq-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
